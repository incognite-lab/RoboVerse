
# -------------------------------------------------------------------------------
# Environment
# -------------------------------------------------------------------------------
sim: mujoco
robots: [g1_no_hands]
task: humanoidbench:Stand
decimation: 10
train_or_eval: train

# -------------------------------------------------------------------------------
# Seeds & Device
# -------------------------------------------------------------------------------
seed: 1
cuda: true
torch_deterministic: true
device_rank: 0

# -------------------------------------------------------------------------------
# Rollout & Timesteps
# -------------------------------------------------------------------------------
num_envs: 1
num_eval_envs: 1
headless: true
total_timesteps: 10000000
learning_starts: 10
num_steps: 4

# -------------------------------------------------------------------------------
# Replay, Batching, Discounting
# -------------------------------------------------------------------------------
buffer_size: 51200
batch_size: 512
gamma: 0.99
tau: 0.1

# -------------------------------------------------------------------------------
# Update Schedule
# -------------------------------------------------------------------------------
policy_frequency: 4
num_updates: 4

# -------------------------------------------------------------------------------
# Optimizer & Network
# -------------------------------------------------------------------------------
critic_learning_rate: 0.003
actor_learning_rate: 0.003
weight_decay: 0.1
critic_hidden_dim: 256
actor_hidden_dim: 256
init_scale: 0.01
num_atoms: 101

# -------------------------------------------------------------------------------
# Value Distribution & Exploration
# -------------------------------------------------------------------------------
v_min: -250.0
v_max: 250.0
policy_noise: 0.05
std_min: 0.05
std_max: 0.5
noise_clip: 0.5

# -------------------------------------------------------------------------------
# Algorithm Flags
# -------------------------------------------------------------------------------
use_cdq: true
compile: false
obs_normalization: true
max_grad_norm: 0.0
amp: true
amp_dtype: fp16
disable_bootstrap: false
measure_burnin: 3

# -------------------------------------------------------------------------------
# Optional Environment-Specific Features
# -------------------------------------------------------------------------------
use_domain_randomization: false
use_push_randomization: false
use_tuned_reward: false
action_bounds: 1.0

# -------------------------------------------------------------------------------
# Logging & Checkpointing
# -------------------------------------------------------------------------------
save_dir: ./checkpoints
project: fasttd3_isaaclab
exp_name: fasttd3_isaaclab
use_wandb: true
checkpoint_path: ./checkpoints/checkpoint_1999000.pt
eval_interval: 1000
save_interval: 10000

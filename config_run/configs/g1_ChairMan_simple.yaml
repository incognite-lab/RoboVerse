# Train or Eval settings
#-------------------------------------------
force: false

#Eveluation settings
#------------------------------------------
#load_model_path: ./my_env/output/ppo_models/run_2025-10-16_13-59-07/model_80003072
load_model_path: ./config_run/output/ppo_model/run_2026-04-15_18_chairmansimple/model_120096000
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-04-10_13_chairman/
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-04-02_20_chairman/model_970776000
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-03-13_14_chairman_top/model_200070000
video_save_path: ./config_run/output/eval_videos/chair_man_8.mp4
eval_episodes: 1
eval_max_steps: 1000


# PPO training settings
#-------------------------------------------
total_timesteps: 1_000_000_000
model_save_path: ./config_run/output/ppo_model
model_save_freq: 10_000_000
tensorboard_log: ./config_run/output/tensorboard


# PPO parameters
#-------------------------------------------
net_arch_pivf: true
net_arch_pi: [64, 64, 64]
net_arch_vf: [64, 64, 64]

learning_rate: 0.0003
n_steps: 32
batch_size: 72000
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.002
vf_coef: 1.0
max_grad_norm: 1.0
# DAgger settings
#-------------------------------------------
dagger_store_per_step: 32
dagger_train_every: 20
dagger_updates_per_train: 10
dagger_batch_size: 512
dagger_buffer_steps: 4000
beta_start: 1.0
beta_decay: 0.9995

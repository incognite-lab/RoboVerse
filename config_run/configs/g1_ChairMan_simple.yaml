#genesis config stand

# Environment settings
#-------------------------------------------
sim: genesis
robots: [g1_slider_simple]
fix_base_link: true
task: chairmansimple
decimation: 5
num_envs: 9000
headless: true
add_table: true
env_spacing: 4.0
train_or_eval: train #load_and_train #train_dagger #eval_video


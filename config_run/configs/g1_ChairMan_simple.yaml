# Train or Eval settings
#-------------------------------------------
force: false

#Eveluation settings
#------------------------------------------
#load_model_path: ./config_run/output/ppo_model/run_2026-04-16_18_chairmansimple/model_50040000
#load_model_path: ./config_run/output/ppo_model/run_2026-04-16_18_chairmansimple/
#load_model_path: ./config_run/output/ppo_model/dagger/
load_model_path: ./config_run/output/ppo_model/run_2026-05-06_18_chairmansimple/

#load_model_path: ./config_run/output/ppo_model/dagger/student_model_step_760000.pth
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-04-16_18_chairman/
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-04-02_20_chairman/model_970776000
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-03-13_14_chairman_top/model_200070000
#load_model_path: ./config_run/output/grpo_model/
video_save_path: ./config_run/output/eval_videos/chair_man_14.mp4
eval_episodes: 100
eval_max_steps: 1500


# PPO training settings
#-------------------------------------------
total_timesteps: 1_000_000_000
model_save_path: ./config_run/output/ppo_model
model_save_freq: 10_000_000
tensorboard_log: ./config_run/output/tensorboard


# PPO parameters
#-------------------------------------------
net_arch_pivf: true
net_arch_pi: [128, 128, 128]
net_arch_vf: [128, 128, 128]

learning_rate: 0.0003
n_steps: 32
batch_size: 8192
n_epochs: 5
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.002
vf_coef: 1.0
max_grad_norm: 1.0
# DAgger settings
#-------------------------------------------


dagger_store_per_step: 32
dagger_train_every: 20
dagger_updates_per_train: 10
dagger_batch_size: 512
dagger_buffer_steps: 4000
beta_start: 1.0
beta_decay: 0.99999
visualization: false


#GRPO parameters
#--------------------------
grpo_learning_rate: 1.0e-5
grpo_total_updates: 200
grpo_group_size: 5
grpo_rollouts_per_batch: 200
grpo_success_bonus: 20.0

grpo_clip_eps: 0.2
grpo_ent_coef: 0.001
grpo_update_epochs: 4
grpo_minibatch_size: 2048
grpo_max_grad_norm: 1.0



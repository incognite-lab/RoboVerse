sim: genesis
robots: [g1_slider_simple]
fix_base_link: true
task: chairmansimple #chairmansimplegrpo # use chairmansimplegaussiangrpo for Gaussian-splat visual room
decimation: 5
num_envs: 100
headless: true
add_table: true
env_spacing: 4.0
train_or_eval: train_dagger  #load_and_train #train_dagger #eval_video #eval_dagger_video #train_grpo #eval_grpo_video


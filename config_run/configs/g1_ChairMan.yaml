#genesis config stand

# Environment settings
#-------------------------------------------
sim: genesis
robots: [g1_slider]
fix_base_link: true
task: chairman
decimation: 5
num_envs: 1
headless: false
add_table: true
env_spacing: 4.0
train_or_eval: eval_video #load_and_train #train_dagger #eval_video




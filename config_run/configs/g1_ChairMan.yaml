#genesis config stand

# Environment settings
#-------------------------------------------
sim: genesis
robots: [g1_slider]
fix_base_link: true
task: chairman
decimation: 5
num_envs: 9000
headless: true
add_table: true
env_spacing: 4.0
train_or_eval: train #eval_video



#camera configuration
#---------------------------------------
#(Pro evaluaci je potřeba odkomentovat)
#---------------------------------------
# cameras:
#    camera1:
#      type: PinholeCameraCfg
#      params:
#        name: camera0
#        pos: (1.5, -1.5, 1.5)
#        look_at: (0.0, 0.0, 0.0)

#genesis config stand

# Environment settings
#-------------------------------------------
sim: genesis
robots: [g1_with_hands]
fix_base_link: false
task: chairman #chairmansimplegrpo # use chairmansimplegaussiangrpo for Gaussian-splat visual room
decimation: 5
num_envs: 15000
headless: true
add_table: true
env_spacing: 4.0
train_or_eval: train  #load_and_train #train_dagger #eval_video #eval_dagger_video #train_grpo #eval_grpo_video

force: false


# PPO training settings
#-------------------------------------------
total_timesteps: 1_000_000_000
model_save_path: ./config_run/output/ppo_models
model_save_freq: 10_000_000
tensorboard_log: ./config_run/output/ppo_models/tensorboard


# PPO parameters
#-------------------------------------------
net_arch_pivf: true
# Oddělený actor/critic. Síť má přibližně 367k parametrů pro
# observation_dim=322 a action_dim=34.
net_arch_pi: [256, 256, 128]
net_arch_vf: [256, 256, 128]

learning_rate: 0.0003

# 15000 envů × 32 kroků = 480000 vzorků na jeden rollout.
# Batch 60000 jej dělí přesně na 8 minibatchů; při 5 epochs je to
# 40 optimizer kroků na jednu PPO aktualizaci.
n_steps: 32
batch_size: 60000
n_epochs: 5

gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.002
vf_coef: 1.0
max_grad_norm: 1.0

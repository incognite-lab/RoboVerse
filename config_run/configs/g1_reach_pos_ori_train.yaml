# Train or Eval settings
#-------------------------------------------
train_or_eval: train

#Eveluation settings
#------------------------------------------


# PPO training settings
#-------------------------------------------
total_timesteps: 200_000_000
model_save_path: ./config_run/output/ppo_model
model_save_freq: 10_000_000
tensorboard_log: ./config_run/output/tensorboard


# PPO parameters
#-------------------------------------------
net_arch: [64, 64, 64]

learning_rate: 0.0003
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
ent_coef: 0.01

#genesis config stand

# Environment settings
sim: sapien3
robots: [g1_with_hands]
task: stand
decimation: 5
num_envs: 1
headless: true
add_table: true
#sensors configuration
sensors:
  sensor1:
    type: GyroSensorCfg
    params:
      name: gyro0
      pos: (0.0, 0.0, 0.0)
      mount_to: g1_with_hands
      mount_link: torso_link

#camera configuration
#---------------------------------------
#(Pro evaluaci je potřeba odkomentovat)
#---------------------------------------

cameras:
   camera1:
     type: PinholeCameraCfg
     params:
       name: camera0
       pos: (3.0, -3.0, 2.0)
       look_at: (0.0, 0.0, 0.0)
       width: 1024
       height: 1024



# Training settings
train_or_eval: eval


#eveluation settings
#load_model_path: ./my_env/output/ppo_models/run_2025-10-16_13-59-07/model_80003072
#load_model_path: ./config_run/output/ppo_model_cluster/ppo_models/run_2025-10-16_13-40-26/model_450000000
#load_model_path: ./config_run/output/ppo_model_cluster/run_2025-10-27_21_stand/model_260052000
load_model_path: ./config_run/output/ppo_model_cluster/run_2025-10-31_17_stand/model_330000000
video_save_path: ./config_run/output/eval_videos/stand_eval_2.mp4
load_model_path_file: ./config_run/output/ppo_model_cluster/run_2025-10-31_17_stand

eval_episodes: 1
eval_max_steps: 300

# PPO training settings
total_timesteps: 90_000_000
model_save_path: ./config_run/output/ppo_model
model_save_freq: 10_000_000

# Eval settings
eval_model_path:

# PPO parameters
net_arch: [128, 128, 128]

learning_rate: 0.0003
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
ent_coef: 0.01

tensorboard_log: ./config_run/output/tensorboard

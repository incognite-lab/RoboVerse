# Train or Eval settings
#-------------------------------------------
train_or_eval: train

#Eveluation settings
#------------------------------------------
#load_model_path: ./my_env/output/ppo_models/run_2025-10-16_13-59-07/model_80003072
load_model_path: ./my_env/output/ppo_models/run_2025-10-15_20-22-31/model_80000000
video_save_path: ./config_run/output/eval_videos/reah_pos_ori_eval.mp4
eval_episodes: 500


# PPO training settings
#-------------------------------------------
total_timesteps: 400_000_000
model_save_path: ./config_run/output/ppo_model
model_save_freq: 10_000_000
tensorboard_log: ./config_run/output/tensorboard


# PPO parameters
#-------------------------------------------
net_arch: [128, 128, 128]

learning_rate: 0.0003
n_steps: 128
batch_size: 256
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
ent_coef: 0.01

#genesis config stand

# Environment settings
#-------------------------------------------
sim: genesis
robots: [g1_with_hands]
fix_base_link: false
task: chairmanmulti #chairmansimplegrpo # use chairmansimplegaussiangrpo for Gaussian-splat visual room
decimation: 5
num_envs: 15000
headless: true
add_table: true
env_spacing: 4.0
train_or_eval: load_and_train

force: false


# Multi-policy PPO training settings
#-------------------------------------------
# Cílový CELKOVÝ počet přechodů včetně již uložených kroků.
# Musí být vyšší než global_timesteps v načítaném manifestu.
total_timesteps: 5_000_000_000
model_save_path: ./config_run/output/ppo_models_multi
# A 15k-env rollout already advances the global counter quickly. Saving less
# often avoids spending training time and disk space on nearly identical
# six-policy bundles.
model_save_freq: 50_000_000
tensorboard_log: ./config_run/output/ppo_models_multi/tensorboard

# Give every stage update at least eight 16k minibatches. A stage with many
# active envs may contribute more because complete on-policy rollouts are kept.
stage_rollout_samples: 131_072

# An individual env switches policy immediately after completing a stage,
# without a physical reset. Reliable policies can then be frozen while still
# controlling their stage during downstream training.
freeze_learned_policies: true
frozen_policy_deterministic: true
stage_advance_success_rate: 0.90
stage_success_window: 1000
stage_min_episodes: 1000

# The first snapshot of every newly reached stage is always kept. Afterwards
# this probability samples successes into the bounded in-memory curriculum,
# avoiding a large CPU-copy burst when thousands of envs advance together.
snapshot_save_probability: 0.1

# Set true only when debugging the pretrained walking controller. False keeps
# the terminal focused on the per-policy PPO training tables.
verbose_motion_diagnostics: false

# Print the active-policy tables after every global rollout. Increase this to
# 5 or 10 if terminal output is still too frequent.
terminal_tables: true
terminal_log_interval: 1
stage_episode_metrics_window: 1000

# Načtení všech šesti policies ze stejného běhu jako v eval_ppo_video.yaml.
# Lze zadat i nadřazený adresář; pak se vybere nejnovější běh s manifestem.
load_model_path: ./config_run/output/ppo_models_multi/run_2026-09-06_19-21-06_chairmanmulti_concurrent

# false: nejnovější kompletně uložený checkpoint uvedený v manifestu;
#        tabulka níže se ignoruje.
# true: pro každý stage se načte stage_X/model_<hodnota>.zip podle tabulky.
#       Musí být uvedeny všechny stages 0–5; lze použít i hodnotu final.
load_model_split_checkpoints: false
load_model_stage_checkpoints:
  0: 915840000
  1: 915840000
  2: 915840000
  3: 915840000
  4: 915840000
  5: 915840000

# Zmražení se VŽDY přebírá z multi_policy_manifest.json vybraného běhu.
# Policies s frozen: true dál řídí svůj stage, ale netrénují se.
# Platí i při ručním výběru starších checkpointů: stav zmražení a čítače
# pocházejí z aktuálního manifestu běhu, nikoli z historie vybraných ZIPů.
# freeze_learned_policies: true výše umožňuje zmrazit další úspěšné policies.
# Načtené modely zachovají architekturu, optimalizér a SB3 hyperparametry
# včetně learning-rate schedule; rollout/batch/epoch nastavení určuje tento YAML.
# PPO parameters
#-------------------------------------------
net_arch_pivf: true
# Oddělený actor/critic; observation_dim=328 a action_dim=34.
# Two 256-wide layers are large enough for the stage-local tasks. The previous
# third layer added compute to all six policies without adding a useful wider
# representation.
net_arch_pi: [256, 256, 128]
net_arch_vf: [256, 256, 128]

learning_rate: 0.0003
# Do not decay against global task progress: downstream policies are unlocked
# later and must still start with the full learning rate.
learning_schedule: constant

# A longer rollout improves temporal credit assignment for the 5-10 second
# stages. Smaller minibatches provide substantially more optimizer steps per
# collected sample while remaining large enough for efficient GPU training.
n_steps: 64
batch_size: 16384
n_epochs: 4

gamma: 0.995
gae_lambda: 0.97
clip_range: 0.2
ent_coef: 0.002
# Initial standard deviation exp(-1) ~= 0.37.  The SB3 default (1.0)
# saturates the small walking-command bounds and makes early rollouts fall.
log_std_init: -1.0
normalize_advantage: true
vf_coef: 0.5
max_grad_norm: 0.5
# Stop an epoch early when a batch would move the policy too far. This is
# especially useful after a new stage is first populated from few snapshots.
target_kl: 0.02

# Train or Eval settings
#-------------------------------------------
force: false

# Stage in which every evaluation reset starts. Stage 0 is procedural;
# stages 1-5 require at least one snapshot in snapshots_chair/stage_X.
# The reset fails with a clear error when the requested snapshot is missing.
# The selected bundle reports training data only for policy 2.
eval_start_stage: 1
reset_to_stage0: false
use_snapshot_curriculum: false
snapshot_save_probability: 0.0

# Show the approach and final hand targets used by the reward. This is visual-only and
# has no collision geometry. It is automatically inactive in headless mode.
visualize_reach_waypoints: true

#Eveluation settings
#------------------------------------------
#load_model_path: ./config_run/output/ppo_model/run_2026-04-16_18_chairmansimple/model_50040000
#load_model_path: ./config_run/output/ppo_model/run_2026-05-06_18_chairmansimple/
#load_model_path: ./config_run/output/ppo_model/dagger4/student_model_step_70000.pth
#load_model_path: ./config_run/output/ppo_model/run_2026-05-06_18_chairmansimple/model_560344000

#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-04-16_18_chairman/
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-04-02_20_chairman/model_970776000
#load_model_path: ./config_run/output/ppo_model_cluster/run_2026-03-13_14_chairman_top/model_200070000
#load_model_path: ./config_run/output/grpo_model/student_grpo_step_145.pth

# Optional: force all stage policies to load stage_X/model_<value>.zip.
# Leave unset to use the checkpoint referenced by multi_policy_manifest.json.
#load_model_checkpoint: 1503360000
# Optional: set a different checkpoint for each stage.
# When true, load_model_stage_checkpoints must define stages 0 through 5.
load_model_split_checkpoints: true
load_model_stage_checkpoints:
  0: 2405376000
  1: 1503360000
  2: 2405376000
 # 3: 2578560000
  #4: 2578560000
 # 5: 2578560000
# Can point either to one concrete run_*_chairmanmulti_concurrent directory or
# to its parent. With a parent directory the newest valid run is selected.
load_model_path: ./config_run/output/ppo_models_multi/run_2026-09-23_17-35-39_chairmanmulti_concurrent
video_save_path: ./config_run/output/eval_videos/chairman_ppo_multi_2.mp4
eval_max_steps: 2000

# Evaluation stops cleanly as soon as the robot reaches a policy that the
# manifest reports as having zero samples/updates. Set true
# only when you intentionally want to see the untrained downstream policies.
eval_allow_untrained_policies: false

# Record one physical episode instead of continuing after the wrapper reset.
eval_stop_on_done: false
video_slowdown: 1

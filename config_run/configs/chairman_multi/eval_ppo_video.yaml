#genesis config stand

# Environment settings
#-------------------------------------------
sim: genesis
robots: [g1_with_hands]
fix_base_link: false
task: chairmanmulti
decimation: 5
num_envs: 1
headless: false
add_table: true
env_spacing: 4.0
train_or_eval: eval_video  #load_and_train #train_dagger #eval_video #eval_dagger_video #train_grpo #eval_grpo_video


# Train or Eval settings
#-------------------------------------------
force: false

# Stage in which every evaluation reset starts. Stage 0 is procedural;
# stages 1-5 require at least one snapshot in snapshots_chairman2_five_stage_v1/stage_X.
# The reset fails with a clear error when the requested snapshot is missing.
# The selected bundle reports training data only for policy 2.
eval_start_stage: 0
reset_to_stage0: false
use_snapshot_curriculum: false
snapshot_save_probability: 0.0

# Show the approach and final hand targets used by the reward. This is visual-only and
# has no collision geometry. It is automatically inactive in headless mode.
visualize_reach_waypoints: true

#Eveluation settings
#------------------------------------------


# Optional: force all stage policies to load stage_X/model_<value>.zip.
# Leave unset to use the checkpoint referenced by multi_policy_manifest.json.
#load_model_checkpoint: 2289600000
# Optional: set a different checkpoint for each stage.
# When true, load_model_stage_checkpoints must define stages 0 through 4.
load_model_split_checkpoints: false
# Can point either to one concrete run_*_chairman2_concurrent directory or
# to its parent. With a parent directory the newest valid run is selected.
load_model_path: ./config_run/output/ppo_models_chairman2_five_stage_v1/REPLACE_WITH_RUN_DIRECTORY
video_save_path: ./config_run/output/eval_videos/chairman2_ppo_multi_0.mp4
eval_max_steps: 2000

# Evaluation stops cleanly as soon as the robot reaches a policy that the
# manifest reports as having zero samples/updates. Set true
# only when you intentionally want to see the untrained downstream policies.
eval_allow_untrained_policies: false

# Record one physical episode instead of continuing after the wrapper reset.
eval_stop_on_done: true
video_slowdown: 1

# Five-stage task schema; old six-policy checkpoints are incompatible.
num_stage_policies: 5
num_eval_stages: 5

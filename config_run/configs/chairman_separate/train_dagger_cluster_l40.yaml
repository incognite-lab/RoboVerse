# ChairMan separate DAgger starting configuration for one L40S (48 GB VRAM).
# Apply the Nyx compatibility and batched body-state fixes on the cluster too.
# Throughput candidate: collect from all 200 envs and scale the student batch.
# For measured hardware-specific selection: python config_run/benchmark_dagger_scaling.py --train-best
# This is a memory-budgeted starting point, not a measured L40S optimum.
# Run: python config_run/main_separate.py chairman_separate/train_dagger_cluster_l40
# For resume: set train_or_eval: load_and_train_dagger and load_student_path
# to this run's student_model_step_<step>.pth (keep its .training.pth sidecar).

sim: genesis
robots: [g1_with_hands]
fix_base_link: false
task: chairmanseparate
decimation: 5
num_envs: 200
headless: true
add_table: true
env_spacing: 4.0
train_or_eval: train_dagger

# Keep the measured visual setup; FastPathTracer did not improve local throughput.
cameras:
  camera1:
    type: NyxGaussianSplatCameraCfg
    params:
      name: camera0
      width: 128
      height: 128
      fov: 65.0
      clipping_range: [0.1, 100.0]
      mount_to: g1_with_hands
      mount_link: head_link
      mount_pos: [0.08, 0.0, 0.35]
      mount_quat: [0.5, 0.5, -0.5, -0.5]
      gaussian_splat_path: ./config_run/splat/splat_2.ply
      gaussian_position: [0.0, 0.0, 1.5]
      gaussian_rotation_xyzw: [0.0, 0.0, -0.70710678, 0.70710678]
      gaussian_scale: [3.0, 3.0, 3.0]
      spp: 8
      render_mode: RefPathTracer
      tone_mapper: "Off"
      render_sim_geometry: true
      standalone_floor: false
      standalone_floor_pos: [0.0, 0.0, -0.03]
      standalone_floor_size: [20.0, 20.0, 0.04]
      standalone_floor_color: [0.55, 0.55, 0.55, 1.0]
      standalone_light_dir: [-0.4, -0.5, -1.0]
      standalone_light_intensity: 5.0
      standalone_metasim_objects: false
      standalone_metasim_robot: false
      gaussian_z_up: true
      open_nyx_window: false
      debug_image_stats: false
      debug_show: false
      debug_show_all_envs: false
      debug_calibrate: false
      debug_detach_from_mount: false
      debug_control_target: camera
      debug_translation_step: 0.05
      debug_rotation_step_deg: 5.0

force: false
reset_to_stage0: false
use_snapshot_curriculum: true
snapshot_save_probability: 0.1

# Keep the original 50M-transition budget: 250,000 vector steps x 200 envs.
# Completion within the Slurm 72h limit depends on measured cluster throughput.
total_timesteps: 250_000
learning_rate: 0.0003
model_save_path: ./config_run/output/dagger_separate_cluster_l40_200
model_save_freq: 1250
tensorboard_log: ./config_run/output/dagger_separate_cluster_l40_200/tensorboard
# Per-run TensorBoard subdirectories; counters restart on resume.
dagger_log_every: 100
dagger_gpu_poll_seconds: 10

dagger_camera_name: camera0
# Render only when the student consumes the final state after all resets.
dagger_defer_camera_rendering: true
dagger_store_per_step: 200
dagger_train_every: 20
# Preserve the original replay ratio: 5 x 4096 / (20 x 200) = 5.12.
# Larger batches change optimizer dynamics; assess success rate as well as loss.
dagger_updates_per_train: 5
dagger_batch_size: 4096
# Capacity = 2,500 vector steps x 200 examples = 500,000 examples.
# RGB uint8 + 31 joint positions + 34 actions = 49,412 bytes/example:
# 24.706 GB (23.01 GiB). Leave the rest of the 48 GB GPU for Genesis,
# Nyx, CUDA workspaces and student activations. This is a replay horizon,
# not a requirement to fill the buffer before learning.
dagger_buffer_steps: 2500
# Keep this buffer in VRAM to avoid CPU/PCIe transfers on every update.
# Slurm --mem=128G allocates separate host RAM; it does not extend VRAM.
# A CPU buffer is supported via device: cpu, but is not the fast default.
dagger_buffer_device: cuda
dagger_buffer_pin_memory: false
# Linear in absolute vector steps: 1 at step 0, 0 at total_timesteps.
# Resume recalculates beta from the checkpoint step, including old exponential runs.
beta_schedule: linear
beta_start: 1.0
beta_end: 0.0

# Directory produced by main_separate.py train. All six policies are loaded
# from separate_policy_manifest.json and compose one teacher action.
expert_model_path: ./config_run/output/ppo_models_separate/run_2026-10-14_19-34-03_chairman_separate
# load_model_checkpoint: 50000000

policies:
  waist:
    action_groups: [waist]
    observation_groups: [joint_positions, robot_body_states, pelvis_velocity, previous_policy_actions]
  right_arm:
    action_groups: [right_arm]
    observation_groups: [joint_positions, right_hand_task, pelvis_velocity, chair_geometry, stage, previous_policy_actions]
  left_arm:
    action_groups: [left_arm]
    observation_groups: [joint_positions, left_hand_task, pelvis_velocity, chair_geometry, stage, previous_policy_actions]
  right_fingers:
    action_groups: [right_fingers]
    observation_groups: [joint_positions, right_hand_task, fingertip_forces, stage, previous_policy_actions]
  left_fingers:
    action_groups: [left_fingers]
    observation_groups: [joint_positions, left_hand_task, fingertip_forces, stage, previous_policy_actions]
  direction:
    action_groups: [direction]
    observation_groups: [joint_positions, pelvis_velocity, chair_geometry, previous_walk_command, stage, previous_policy_actions]
